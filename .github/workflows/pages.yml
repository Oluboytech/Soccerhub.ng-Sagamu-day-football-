name: Deploy SoccerHub Data API to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare API files
        run: |
          mkdir -p public

          # Publish competition data
          cp -r data/. public/

          # Publish team/player/venue assets
          cp -r assets public/

          cat > public/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>SoccerHub Data API</title>
          </head>
          <body>
            <h1>SoccerHub Data API</h1>
            <p>Sagamu Day Football Competition 2026</p>
            <p>Official competition data service.</p>
          </body>
          </html>
          HTML

          touch public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
